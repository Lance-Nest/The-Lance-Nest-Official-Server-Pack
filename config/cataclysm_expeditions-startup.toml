#Maximum number of players allowed in an expedition. The UI might not look good with more than 4 players.
# Default: 4
# Range: 1 ~ 100
maxExpeditionPlayerCount = 4
#Number of seconds that a player has to wait to access the same expedition again.
#The cooldown will still decrease when the player is offline or the server is stopped.
#When set to 0, no cooldown is applied.
#Is displayed as hours, minutes and seconds ingame.
#
# Default: 3600
# Range: > 0
expeditionCooldown = 1
#Distance between the expedition structures in chunks.
# Default: 100
# Range: > 10
distanceBetweenExpeditionStructures = 100
#Enables the recipe for the hub anchor that is needed to enter the hub. If you disable this setting, you will have to implement another way to get to the hub yourself.
hubAnchorRecipeEnabled = true
#Number of chunks of a structure that are generated in one batch. Higher values lead to longer loading times but also lower lag spikes.
# Default: 2
# Range: 1 ~ 5
structureGenerationBatchSize = 2
#Number of seconds that an expedition lobby should be open for others to join. When set to 0, no other players can join.
# Default: 30
# Range: > 0
expeditionLobbyDuration = 30
#Whether the expedition cooldown should be reset when players leave the expedition while the lobby is still open.
#This should probably be turned off when the lobby duration is high.
#
resetExpeditionCooldownWhenLeavingDuringLobby = true

	[expeditionPositions.netherite_monstrosity]
		#Defines the position of where the player will be teleported when starting a "netherite_monstrosity" expedition
		#The position must be four numbers separated by spaces. Three floats for the coordinates and one integer for the yaw.
		#
		teleportOffset = "-1.5 46.0 10.5 0"
		#Defines the positions of the anchors for the "netherite_monstrosity" expedition.
		#Each position is three integers (x y z) separated by spaces.
		#
		anchorOffsets = ["-1 46 12"]
		#Defines the bounding box of the "netherite_monstrosity" expedition via two opposite corners.
		#Each corner is three integers (x y z) separated by spaces; the two corners are separated by a colon.
		#
		structureBoundaryOffsets = "-48 -64 -92:108 300 91"

